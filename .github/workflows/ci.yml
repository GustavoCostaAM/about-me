name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require versioned dependency lock
        run: |
          if [ ! -f package-lock.json ]; then
            echo '::error file=package-lock.json::Missing package-lock.json. Generate it locally with npm install --package-lock-only --ignore-scripts and commit it before running CI. npm ci requires this file.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install all locked dependencies
        id: dependencies
        run: npm ci --include=dev
      - name: Install Chromium
        id: browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Build complete public site
        id: build
        run: npm run build
      - name: HTML lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint:html
      - name: CSS lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint:css
      - name: Integrity checker regression tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:integrity
      - name: Local paths and anchors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:links
      - name: External links (availability warnings)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:external
      - name: All HTML pages - desktop accessibility
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.browser.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run test:a11y
      - name: Save diagnostics and complete page manifests
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/
          if-no-files-found: error
          retention-days: 30
      - name: Save approved site for CD
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7

